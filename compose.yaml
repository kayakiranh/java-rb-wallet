# TR: Bilgisayarında kurulu Oracle kullanılır; ikinci bir Oracle veritabanı başlatılmaz.
# IDE ile çalıştırırken adres localhost; container'dan bilgisayara erişirken host.docker.internal.
services:
  fake:
    build:
      context: .
      dockerfile: fake-services-api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      FAKE_API_KEY: ${FAKE_API_KEY:?Set FAKE_API_KEY}
      FAKE_STORAGE_PATH: /app/data/fake-state.json
    ports: ["127.0.0.1:5081:5081"]
    volumes: ["fake-data:/app/data"]
  wallet:
    build:
      context: .
      dockerfile: wallet-api/Dockerfile
    environment:
      WALLET_DB_URL: ${WALLET_DB_URL:-jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1}
      WALLET_DB_USER: ${WALLET_DB_USER:-RBWALLET}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?Set WALLET_DB_PASSWORD}
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY}
      FAKE_BASE_URL: http://fake:5081/
      FAKE_API_KEY: ${FAKE_API_KEY}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:5080:5080"]
    depends_on:
      fake:
        condition: service_started
volumes:
  fake-data:
