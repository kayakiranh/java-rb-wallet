# TR: Yalnızca CI/izole test için. PC'deki Oracle'a bağlanmaz; dışarı 1521 portu açılmaz.
# Kullanım: docker compose -f compose.yaml -f compose.oracle-test.yaml up --build -d
services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:?Set disposable ORACLE_ADMIN_PASSWORD}
      APP_USER: RBWALLET
      APP_USER_PASSWORD: ${WALLET_DB_PASSWORD:?Set disposable WALLET_DB_PASSWORD}
    shm_size: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 60
  wallet:
    environment:
      WALLET_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      WALLET_DB_USER: RBWALLET
    depends_on:
      oracle:
        condition: service_healthy
