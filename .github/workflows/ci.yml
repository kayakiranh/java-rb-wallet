name: Java 25 wallet verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile and test both modules on Java 25
        run: mvn -B verify
      - name: Generate disposable demo secrets
        run: |
          echo "ORACLE_ADMIN_PASSWORD=Ci_$(openssl rand -hex 16)" > .env
          echo "WALLET_DB_PASSWORD=Ci_$(openssl rand -hex 16)" >> .env
          echo "JWT_KEY=$(openssl rand -hex 32)" >> .env
          echo "FAKE_API_KEY=$(openssl rand -hex 24)" >> .env
      - name: Start isolated Oracle Free and both Java APIs
        run: docker compose -f compose.yaml -f compose.oracle-test.yaml up --build -d
      - name: Real HTTP, money, concurrency, recovery and restart tests
        run: |
          set -a
          source .env
          set +a
          COMPOSE_FILE=compose.yaml:compose.oracle-test.yaml TEST_RESTART=1 python3 tests/smoke.py
      - name: Browser journey
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 tests/ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports
            test-results/
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.oracle-test.yaml logs --no-color --tail=150
      - name: Stop disposable CI environment
        if: always()
        run: docker compose -f compose.yaml -f compose.oracle-test.yaml down -v
