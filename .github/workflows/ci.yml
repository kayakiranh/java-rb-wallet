name: Java 25 wallet verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile and test both modules on Java 25
        run: mvn -B verify
      - name: Generate disposable demo secrets
        run: |
          echo "MSSQL_SA_PASSWORD=Ci_$(openssl rand -hex 16)!" > .env
          echo "JWT_KEY=$(openssl rand -hex 32)" >> .env
          echo "FAKE_API_KEY=$(openssl rand -hex 24)" >> .env
      - name: Start real SQL Server and both Java APIs
        run: docker compose up --build -d
      - name: Real HTTP, money, concurrency, recovery and restart tests
        run: |
          set -a
          source .env
          set +a
          TEST_RESTART=1 python3 tests/smoke.py
      - name: Browser journey
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 tests/ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports
            test-results/
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop disposable CI environment
        if: always()
        run: docker compose down -v
