server:
  port: ${PORT:5080}
spring:
  application:
    name: wallet-api
  datasource:
    url: ${WALLET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${WALLET_DB_USER:RBWALLET}
    password: ${WALLET_DB_PASSWORD:}
    hikari:
      # TR: Free sürümün 2 CPU / 2 GB DB sınırı için küçük bir bağlantı havuzu.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    enabled: true
    # TR: Oracle DDL ayrı konumdadır; SQL Server migration geçmişiyle karışmaz.
    locations: classpath:db/migration/oracle
  jackson:
    serialization:
      write-dates-as-timestamps: false
wallet:
  jwt-key: ${JWT_KEY:}
  issuer: rb-wallet
  audience: rb-wallet-client
  fake-url: ${FAKE_BASE_URL:http://localhost:5081/}
  fake-key: ${FAKE_API_KEY:}
springdoc:
  swagger-ui:
    path: /swagger
